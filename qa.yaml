mvp_language_scope:
  decision: >
    For MVP, the chat should stick to English only. This is intentionally a
    prompt-level constraint, not a multilingual product slice.
  source_session: 07ac7364-0928-42fd-a285-cbfcf4e3ef9c
  implementation_note: >
    The TurnPlanner prompt should tell the model to always reply in English, not
    switch into French or another language, and preserve language_barrier when
    the customer cannot continue in English or needs interpreter support. Do not
    collect free-form non-English intake details in MVP; the deterministic
    handoff checks are English-label based, so route to human help when English
    blocks completion. Non-English text alone should not become complaint,
    distress, hardship, legal_threat, or account-specific evidence without a
    genuine additional signal.

