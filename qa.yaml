        and complaint, making the handoff route more justified after the fact.
  follow_up_notes:
    - >
      Trace customerMessage is actually the outgoing customer-facing assistant
      copy, not the inbound user text. The inbound message is in state.history
      and can be linked by inboundMessageId.
    - >
      The main quality issues to investigate are weak lexical retrieval terms,
      sticky safety state, and post-ticket handling of public side questions.

