    - turn: 26
      finding: >
        Top retrieval was cant-pay-this-month, matched only on "pay". That set
        route_vulnerability and sticky vulnerability/sensitive flags.
      selected_serving_mode: route_vulnerability
      proposed_action: request_handoff_intake
      final_action: request_handoff_intake
      top_retrieval:
        item_id: cant-pay-this-month
        score: 9
        serving_mode: route_vulnerability
        matched_terms:
          - pay
      validator_overrides:
        - vulnerability_route_match
      safety_flags:
        - account_specific_request
        - sensitive_overshare
        - vulnerability
    - turns: "28-42"
      finding: >
        Intake continued until the required fields were treated as complete.
    - turn: 44
      finding: >
        handoff_intake_complete converted the turn to create_ticket after the
        earlier safety route.
