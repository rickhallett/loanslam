items:
  - id: stakeholder-demo-safe-display-boundary
    title: Add a stakeholder-demo safe display boundary
    status: todo
    labels:
      - needs-triage
    priority: high
    description: >
      Return customer-facing UI plus compact decision telemetry from the demo API
      without exposing full engine state, planner output, traces, validator
      reasons, retrieval terms, or raw JSON to the browser.
    acceptance:
      - The demo response contains only customer-facing message, UI, terminal
        status, host context, display telemetry, and any opaque state token needed
        by the deployment shape.
      - The review state-machine console still animates from compact telemetry
        without requiring full ValidatedTurnResult data in the browser.
      - Browser-visible responses omit plan, full trace, full state history,
        collected fact values, validator reason text, route reason text, matched
        terms, shadow-signal notes/queries, and raw JSON dumps.
      - The local lab API remains available for trusted full-evidence development
        use but is not exposed by the stakeholder deployment route.
      - Typecheck, focused mapper/API tests, and a production build pass.
  - id: lab-api-mcp-session-simulator
    title: Build a Lab API MCP session simulator
    status: todo
    labels:
      - needs-triage
    priority: medium
    description: >
      Expose the browser-free Phase 0 lab API session simulator as a local MCP
      server with one-turn stepping, evidence summaries, validated dumps, and
      allowlisted localhost API access.
    acceptance:
      - MCP tools can start a session, send one message, fetch current state, reset,
        dump, summarize, and plan a scenario.
      - Message sending always fetches the full session after the POST before
        reporting evidence.
      - Dumps are written under artifacts/phase0 and validated for conversation
        reference, history, and traces.
      - Base URLs are restricted to known local lab API surfaces.
      - Typecheck and focused tests pass.
  - id: tidy-js-import-specifiers
    title: Tidy up .js import specifiers
    status: todo
    priority: medium
    description: >
      Remove TypeScript source imports that use .js specifiers and keep this
      repository a no-js-zone for local source imports.
    acceptance:
      - TypeScript source imports use extensionless local specifiers.
      - No new .js local import specifiers are introduced in TypeScript source.
      - Typecheck and format checks pass after the cleanup.
