services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: loanslam-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDev!Passw0rd}
    ports:
      - "${MSSQL_PORT:-1434}:1433"
    healthcheck:
      test:
        ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s
    volumes:
      - loanslam-mssql-data:/var/opt/mssql

volumes:
  loanslam-mssql-data:
