first_dependency_chain:
  - id: ipoc-001-roadmap-and-scaffold
    status: completed
    depends_on: []
    summary: Create the committed roadmap and separate Integrated POC app package.
    write_scope:
      - docs/roadmaps/2026-07-01-integrated-poc-roadmap.yaml
      - packages/integrated-poc/
      - package.json
      - package-lock.json
    proof_bar:
      - New app/package is isolated from site and widget-adapter packages.
      - Root scripts can run Integrated POC local dev, build, and typecheck targets.
      - Staged gate passes before commit.
  - id: ipoc-002-customer-visible-contract
    status: completed
    depends_on:
      - ipoc-001-roadmap-and-scaffold
    summary: Port one current-safe support or handoff-shaped customer journey into the new app surface.
    write_scope:
      - packages/integrated-poc/
    proof_bar:
      - Customer can start the journey through the Integrated POC app.
      - The path preserves current safe assistant behavior without adding account answers or actions.
  - id: ipoc-003-engine-route
    status: completed
    depends_on:
      - ipoc-002-customer-visible-contract
    summary: Route the customer turn through the current engine contract or a thin adapter over processTurn.
    write_scope:
      - packages/integrated-poc/server/
      - packages/integrated-poc/shared/
    proof_bar:
      - Server API owns engine invocation and state boundaries.
      - Browser receives a display-safe response model, not internal trace-only data.
  - id: ipoc-004-thin-ticket-context
    status: completed
    depends_on:
      - ipoc-003-engine-route
    summary: Record thin mock support/ticket context for handoff-shaped turns.
    write_scope:
      - packages/integrated-poc/server/
      - packages/integrated-poc/shared/
    proof_bar:
      - Mock store contains no real PII and performs no webhook or account side effects.
      - Ticket/support context can be read back by server-side code.
  - id: ipoc-005-admin-readback
    status: completed
    depends_on:
      - ipoc-004-thin-ticket-context
    summary: Add the admin/human-agent readback view for the mock ticket context.
    write_scope:
      - packages/integrated-poc/app/
      - packages/integrated-poc/server/
    proof_bar:
      - Admin view lists and inspects the ticket/support context created by the customer path.
  - id: ipoc-006-browser-proof
    status: completed
    depends_on:
      - ipoc-005-admin-readback
    summary: Capture local browser proof through the real app path and server/admin readback.
    write_scope:
      - artifacts/integrated-poc/
      - docs/roadmaps/2026-07-01-integrated-poc-roadmap.yaml
    proof_bar:
      - Receipt names commands, local URLs, screenshots or artifacts, and commit hashes.
      - Static tests are not presented as behavior proof.
    receipt: artifacts/integrated-poc/ipoc-golden-path-01-proof.md
handoff_capture_chain:
  - id: ipoc-007-handoff-capture-form
    status: completed
    depends_on:
      - ipoc-006-browser-proof
    summary: Add customer-side handoff capture form with current engine intake fields.
    write_scope:
      - packages/integrated-poc/
    proof_bar:
      - Customer can submit synthetic demo-only handoff fields after the engine asks for intake.
      - Form uses fullName, dateOfBirth, postcode, email, and phone only.
  - id: ipoc-008-intake-ticket-update
    status: completed
    depends_on:
      - ipoc-007-handoff-capture-form
    summary: Validate and attach structured intake fields to the thin mock ticket.
    write_scope:
      - packages/integrated-poc/server/
      - packages/integrated-poc/shared/
    proof_bar:
      - Mock ticket remains in-memory and does not become CRM, auth, webhook, or account state.
      - Server/admin readback shows the synthetic structured intake.
  - id: ipoc-009-capture-browser-proof
    status: completed
    depends_on:
      - ipoc-008-intake-ticket-update
    summary: Capture browser proof for message, handoff response, form submission, and admin readback.
    write_scope:
      - artifacts/integrated-poc/
      - docs/roadmaps/2026-07-01-integrated-poc-roadmap.yaml
    proof_bar:
      - Receipt names commands, local URLs, screenshots or artifacts, and commit hashes.
      - Static tests are not presented as behavior proof.
    receipt: artifacts/integrated-poc/ipoc-handoff-capture-01-proof.md
human_gates:
  - choosing a framework other than the Nuxt/Vue Integrated POC app direction
  - abandoning the separate Integrated POC app/package
  - changing the Customer-Visible Contract instead of porting it
  - adding real auth, PII persistence, CRM, SoloSight, webhook, deployment, or secret changes
  - expanding into existing-customer lookup, account answers, or account actions
  - promoting a branch with inherited ENGINE risk without the required integration proof
stop_conditions:
  - app scaffold requires mutating site or widget-adapter packages
  - current engine route cannot be reused without changing engine behavior
  - mock ticket store grows into a fake enterprise model
  - browser proof cannot run through the real app path
  - roadmap, agenda card, implementation diff, and proof receipt disagree
post_first_chain_touchstones:
  - handoff capture form and structured intake readback
  - read-only existing-customer/context lookup
  - read-only account-answer demo using mock records
  - agent/admin workflow improvements for handoff review and human readback
  - widget-adapter sunset once the Integrated POC is demoable enough
  - scoped action capability only if stakeholder value later justifies the risk
