arc_003_chain:
  # Batch-authorized arc: human green-light given upfront 2026-07-01 (D037/D038).
  # Machine gates between slices; per-slice proof receipts; human checkpoint at arc closeout.
  - id: ipoc-010-customer-lookup
    slice_label: ipoc-customer-lookup-01
    status: completed
    receipt: artifacts/integrated-poc/ipoc-customer-lookup-01-proof.md
    depends_on:
      - ipoc-009-capture-browser-proof
    summary: Read-only existing-customer lookup against synthetic mock records.
    write_scope:
      - packages/integrated-poc/
    proof_bar:
      - Lookup matches on fullName, dateOfBirth, address, and loanReference only (D038).
      - No match discloses no data and degrades to the current safe handoff path.
      - Mock records are synthetic, in-memory, and never real PII.
  - id: ipoc-011-account-answers
    slice_label: ipoc-account-answers-01
    status: completed
    receipt: artifacts/integrated-poc/ipoc-account-answers-01-proof.md
    depends_on:
      - ipoc-010-customer-lookup
    summary: Read-only account-answer demo from the matched mock record.
    write_scope:
      - packages/integrated-poc/
    proof_bar:
      - Answer set is nextPaymentDate, outstandingBalance, and loanStatus only (D038 default).
      - Answers render server-side from the mock record; browser never receives the full record.
      - No account action or write-capable flow is introduced.
  - id: ipoc-012-admin-workflow
    slice_label: ipoc-admin-workflow-01
    status: completed
    receipt: artifacts/integrated-poc/ipoc-admin-workflow-01-proof.md
    depends_on:
      - ipoc-009-capture-browser-proof
    summary: Admin/human-agent workflow improvements — ticket status transitions, notes, lookup/answer activity.
    write_scope:
      - packages/integrated-poc/
    proof_bar:
      - Admin readback shows ticket status transitions, agent notes, and lookup/answer activity.
      - Ticket store remains thin and in-memory.
  - id: ipoc-013-integration-proof
    slice_label: ipoc-integration-proof-01
    status: completed
    receipt: artifacts/integrated-poc/ipoc-integration-proof-01-proof.md
    depends_on:
      - ipoc-011-account-answers
      - ipoc-012-admin-workflow
    summary: Committed ipoc integration battery (API + live-engine boundary case) plus proof receipts for lookup and answer paths.
    write_scope:
      - scripts/
      - artifacts/integrated-poc/
      - docs/roadmaps/2026-07-01-integrated-poc-roadmap.yaml
    proof_bar:
      - Receipts name commands, local URLs, screenshots or artifacts, and commit hashes.
      - Hell Week battery covers lookup and account-answer paths using the OpenAI provider ladder.
      - Static tests are not presented as behavior proof.
  - id: ipoc-014-adapter-sunset-assessment
    slice_label: ipoc-adapter-sunset-01
    status: completed
    receipt: docs/reports/2026-07-01-widget-adapter-sunset-assessment.md
    depends_on:
      - ipoc-013-integration-proof
    summary: Widget-adapter sunset assessment — written recommendation with evidence, no deletion.
    write_scope:
      - docs/
    proof_bar:
      - Assessment names what the Integrated POC now covers, what the adapter still uniquely provides, and a recommendation.
      - Acting on the recommendation remains behind a human gate.
