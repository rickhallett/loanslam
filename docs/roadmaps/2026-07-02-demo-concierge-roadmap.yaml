human_gates:
  - anything listed under Non-Goals / Preserved Human Gates in the campaign
    card (engine path, Astro site, DNS, auth/PII/CRM, productization)
  - any expansion of the concierge beyond the apply journey
stop_conditions:
  - contact battery or /contact/ closed-state parity cannot be preserved by
    the surface lift
  - concierge work creates pressure to modify the validated engine path
  - form-state read-in requires restructuring ApplicationJourney.vue beyond a
    thin reactive store
  - consistency check fails at an arc close
  - card, roadmap, diff, and receipts disagree
