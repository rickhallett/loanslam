human_gates:
  - no engine, prompt, validator, or concierge changes (measurement only)
  - no changes to the hard floor's five dimensions
  - no multilingual scenarios without an accepted language-posture D-entry
  - all campaign-protocol irreducible human gates
stop_conditions:
  - customer simulator cannot hold persona after bounded prompt iteration
  - judge calibration cannot reach the recorded threshold
  - customer+judge spend exceeds $10 on a review run or $40 cumulative
  - any keel amendment attempted without a dated card amendment
