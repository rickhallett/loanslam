human_gates:
  - any intentional deviation from the Astro output (content, styling, routes, redirects, SEO)
  - touching site/, loanslam-site, loanslam-ipoc, Postgres, DNS, or custom domains
  - cutover or retirement of the Astro site service
stop_conditions:
  - parity cannot converge on a route without changing content
  - the harness requires mocked rendering instead of the real apps
  - card, roadmap, implementation diff, and receipts disagree
